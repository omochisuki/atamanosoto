<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>頭の外</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>

  <main class="app">

    <!-- =====================
         Header
    ====================== -->

    <header class="header">

      <h1>頭の外</h1>

      <p>
        頭の中に置いておかなくていい。
      </p>

    </header>


    <!-- =====================
         Input
    ====================== -->

    <section class="input-section">

      <label for="memo">
        今、頭に浮かんだこと
      </label>

      <textarea
        id="memo"
        placeholder="思いついたことを、雑にどうぞ。"
      ></textarea>


      <!-- Image -->

      <div class="image-area">

        <label
          for="imageInput"
          class="image-button"
        >
          📷 画像を追加
        </label>

        <input
          id="imageInput"
          type="file"
          accept="image/*"
          hidden
        >

        <div id="imagePreview"></div>

      </div>


      <button id="saveButton">
        外に出す
      </button>

    </section>


    <!-- =====================
         Category Navigation
    ====================== -->

    <nav class="category-nav">

      <button
        class="category-tab active"
        data-category="すべて"
      >
        すべて
      </button>

      <button
        class="category-tab"
        data-category="分類なし"
      >
        未分類
      </button>

      <div id="categoryTabs"></div>

      <button
        id="addCategoryButton"
        class="add-category-tab"
      >
        ＋ カテゴリー
      </button>

    </nav>


    <!-- =====================
         Memory
    ====================== -->

    <section class="memory-section">

      <div class="section-title">

        <h2 id="listTitle">
          すべての記録
        </h2>

        <button
          id="clearButton"
          class="clear-button"
        >
          すべて削除
        </button>

      </div>


      <div id="memoList"></div>


      <p
        id="emptyMessage"
        class="empty-message"
      >
        まだ何もありません。<br>
        思いついたことを、ひとまず外に出してみよう。
      </p>

    </section>


    <!-- =====================
         Modal
    ====================== -->

    <div
      id="detailModal"
      class="modal"
    >

      <div class="modal-content">

        <button
          id="closeModal"
          class="close-modal"
        >
          ×
        </button>

        <div id="detailContent"></div>

      </div>

    </div>


  </main>


  <script src="script.js"></script>

</body>

</html>
